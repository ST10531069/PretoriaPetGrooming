<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry | Book Pet Grooming Pretoria - Cost Estimate</title>
<meta name="description" content="Enquire about dog grooming services in Pretoria. Get cost estimate, check availability, volunteer or sponsor.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>Pretoria Pet Grooming</h1>
<button class="hamburger" onclick="toggleMenu()">☰</button>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="enquiry.html">Enquiry</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<main>
<h2>Enquire About Services, Volunteering or Sponsorship</h2>
<h3>We will respond with cost & availability</h3>

<form id="enquiryForm" onsubmit="return validateEnquiry(event)" action="mailto:info@pretoriapetgrooming.co.za" method="POST">
<label>Full Name:</label>
<input type="text" id="name" placeholder="e.g. John Doe" required>

<label>Email:</label>
<input type="email" id="email" placeholder="john@example.com" required>

<label>Phone (10 digits):</label>
<input type="tel" id="phone" placeholder="0821234567" required>

<label>Service Type:</label>
<select id="serviceType">
<option>Full Grooming</option>
<option>Basic Wash</option>
<option>Cat Grooming</option>
<option>Nail Clipping</option>
<option>Volunteer</option>
<option>Sponsor</option>
</select>

<label>Your Message:</label>
<textarea id="message" placeholder="Tell us about your pet..." required></textarea>

<p id="formError" style="color:red; font-weight:bold;"></p>
<button type="submit">Send Enquiry</button>
</form>

<div id="costModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999;"><div style="background:white; padding:20px; max-width:400px; margin:15% auto; border-radius:10px; text-align:center;"><p id="modal-text"></p><button onclick="closeModal()">Close</button></div></div>
</main>
<footer><p>&copy; 2026 Pretoria Pet Grooming</p></footer>
<script src="js/script.js"></script>
</body>
</html>
