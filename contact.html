<main>
<h2>Contact Us - General Message</h2>
<div id="map" style="height:300px; border-radius:12px; margin-bottom:15px; width:100%;"></div>

<form id="contactForm" onsubmit="return validateContact(event)" action="mailto:info@pretoriapetgrooming.co.za" method="post" enctype="text/plain">
<label>Full Name:</label>
<input type="text" id="cname" required>
<label>Email:</label>
<input type="email" id="cemail" required>
<label>Message Type:</label>
<select id="msgType"><option>General</option><option>Complaint</option><option>Compliment</option></select>
<label>Full Message:</label>
<textarea id="fullMsg" required></textarea>
<p id="contactError" style="color:red; font-weight:bold;"></p>
<button type="submit">Send Message</button>
</form>
</main>
<footer><p>&copy; 2026 Pretoria Pet Grooming</p></footer>
