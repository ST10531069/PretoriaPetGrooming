<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Dog & Cat Grooming Prices Pretoria</title>
<meta name="description" content="View our pet grooming services in Pretoria. Basic wash R150, Full grooming R350. Search and filter services.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>Pretoria Pet Grooming</h1>
<button class="hamburger" onclick="toggleMenu()">☰</button>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="enquiry.html">Enquiry</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<main>
<h2>Our Grooming Services</h2>
<h3>Search & Dynamic Loading</h3>
<input type="text" id="searchInput" onkeyup="searchServices()" placeholder="Search: wash, cat, grooming..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;">
<div id="service-list" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-top:15px;"></div>

<!-- Modal for cost -->
<div id="costModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999;"><div style="background:white; padding:20px; max-width:400px; margin:15% auto; border-radius:10px; text-align:center;"><p id="modal-text"></p><button onclick="closeModal()" style="margin-top:10px;">Close</button></div></div>

<!-- Lightbox for your grooming-action.jpg -->
<img src="images/grooming-action.jpg" style="width:100%; max-width:350px; height:auto; display:block; margin:20px auto; border-radius:12px; cursor:zoom-in;" onclick="openLightbox(this.src)" alt="Dog grooming action Pretoria">
<div id="lightbox" onclick="closeLightbox()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:9999;"><img id="lightbox-img" style="max-width:90%; max-height:90%;"></div>
</main>
<footer><p>&copy; 2026 Pretoria Pet Grooming</p></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/script.js"></script>
</body>
</html>
